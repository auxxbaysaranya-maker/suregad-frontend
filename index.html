<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3a3fe0" />
    <meta
      name="description"
      content="SureGad is a trust-first marketplace for used and refurbished phones and laptops with independent physical inspection."
    />
    <link rel="icon" href="/brand/favicon-64.png" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/brand/mark.png" />
    <link rel="preload" as="image" href="/brand/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>SureGad — Used & refurbished phones and laptops</title>
    <style>
      #sg-preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 90% at 50% 40%, #ffffff 0%, #f6f3ff 55%, #ece6fb 100%);
        transition: opacity 0.55s ease, visibility 0.55s ease;
      }
      #sg-preloader.sg-pl-out {
        opacity: 0;
        visibility: hidden;
      }
      #sg-preloader.sg-pl-out .sg-pl-stage {
        transform: scale(1.06);
        filter: blur(6px);
      }
      .sg-pl-stage {
        position: relative;
        width: 280px;
        height: 200px;
        display: grid;
        place-items: center;
        transition: transform 0.55s ease, filter 0.55s ease;
      }
      .sg-pl-orb {
        position: absolute;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(10, 82, 227, 0.55) 0%, rgba(106, 47, 208, 0.35) 38%, rgba(192, 101, 230, 0.12) 62%, transparent 72%);
        filter: blur(18px);
        animation: sg-orb-in 0.7s ease-out both, sg-orb-pulse 2.4s ease-in-out 0.7s infinite;
      }
      .sg-pl-mark {
        position: absolute;
        width: 104px;
        height: 104px;
        animation: sg-mark-in 0.85s cubic-bezier(0.2, 0.8, 0.2, 1) 0.15s both, sg-mark-out 0.45s ease-in 1.05s forwards;
      }
      .sg-pl-word {
        position: absolute;
        width: 250px;
        height: auto;
        animation: sg-word-in 0.75s cubic-bezier(0.2, 0.8, 0.2, 1) 1.05s both;
      }
      .sg-pl-bar {
        position: absolute;
        bottom: 6px;
        width: 92px;
        height: 3px;
        border-radius: 99px;
        overflow: hidden;
        background: rgba(58, 63, 224, 0.12);
        animation: sg-fade 0.4s ease 0.4s both;
      }
      .sg-pl-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 45%;
        border-radius: inherit;
        background: linear-gradient(90deg, #0a52e3, #6a2fd0, #c065e6);
        animation: sg-bar 1.1s ease-in-out infinite;
      }
      .sg-quick .sg-pl-mark {
        display: none;
      }
      .sg-quick .sg-pl-word {
        animation: sg-fade 0.3s ease both;
      }
      .sg-quick .sg-pl-orb {
        animation: sg-fade 0.3s ease both, sg-orb-pulse 2.4s ease-in-out infinite;
      }
      .sg-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      @keyframes sg-orb-in {
        from { transform: scale(0.3); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      @keyframes sg-orb-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.12); opacity: 0.75; }
      }
      @keyframes sg-mark-in {
        from { opacity: 0; filter: blur(16px); transform: scale(0.6) rotate(-14deg); clip-path: circle(0% at 30% 70%); }
        to { opacity: 1; filter: blur(0); transform: scale(1) rotate(0); clip-path: circle(80% at 50% 50%); }
      }
      @keyframes sg-mark-out {
        to { opacity: 0; filter: blur(8px); transform: scale(1.15); }
      }
      @keyframes sg-word-in {
        from { opacity: 0; filter: blur(12px); clip-path: inset(0 100% 0 0); transform: translateX(-8px); }
        to { opacity: 1; filter: blur(0); clip-path: inset(0 0 0 0); transform: translateX(0); }
      }
      @keyframes sg-bar {
        from { transform: translateX(-110%); }
        to { transform: translateX(230%); }
      }
      @keyframes sg-fade {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .sg-pl-mark { display: none; }
        .sg-pl-orb, .sg-pl-word, .sg-pl-bar, .sg-pl-bar::after { animation: none; }
      }
    </style>
    <script>
      (function () {
        var quick = false;
        try {
          quick = sessionStorage.getItem("sg_intro") === "1";
          sessionStorage.setItem("sg_intro", "1");
        } catch (error) {}
        if (quick) document.documentElement.classList.add("sg-quick");
        window.__sgStart = performance.now();
        window.__sgDismiss = function () {
          var el = document.getElementById("sg-preloader");
          if (!el || el.getAttribute("data-leaving")) return;
          el.setAttribute("data-leaving", "1");
          var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          var min = quick || reduced ? 300 : 1800;
          var wait = Math.max(0, min - (performance.now() - window.__sgStart));
          setTimeout(function () {
            el.classList.add("sg-pl-out");
            setTimeout(function () {
              if (el.parentNode) el.parentNode.removeChild(el);
            }, 600);
          }, wait);
        };
        // Never leave the overlay up if the app fails to boot.
        setTimeout(function () {
          window.__sgDismiss();
        }, 6000);
      })();
    </script>
  </head>
  <body>
    <div id="sg-preloader" role="status">
      <span class="sg-sr">Loading SureGad</span>
      <div class="sg-pl-stage" aria-hidden="true">
        <div class="sg-pl-orb"></div>
        <img class="sg-pl-mark" src="/brand/mark.png" alt="" />
        <img class="sg-pl-word" src="/brand/logo.png" alt="" />
        <div class="sg-pl-bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
